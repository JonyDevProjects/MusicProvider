name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Typecheck, Test & Build Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Run unit & integration tests
        run: npm test

      - name: Build plugin bundle
        run: npm run build:plugin

      - name: Package plugin
        run: npm run package

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-provider-plugin
          path: music-provider-plugin.zip
          retention-days: 7
